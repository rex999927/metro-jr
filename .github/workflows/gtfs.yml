name: Aktualizace jizdnich radu

on:
  schedule:
    - cron: '17 3 * * *'   # kazdy den ve 3:17 UTC
  workflow_dispatch:        # i rucni spusteni tlacitkem

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stazeni PID GTFS
        run: |
          curl -fsSL --retry 3 -o PID_GTFS.zip https://data.pid.cz/PID_GTFS.zip
          mkdir gtfs && unzip -q PID_GTFS.zip -d gtfs
      - name: Prevod
        run: |
          mkdir out
          node gtfs-build.js gtfs out/jr.bin.gz
          cat out/jr.meta.json
      - name: Zverejneni (vetev data)
        run: |
          cd out
          git init -q -b data
          git config user.name "gtfs-bot"
          git config user.email "gtfs-bot@users.noreply.github.com"
          git add .
          git commit -q -m "jizdni rady $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
